<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <title> Трансформация и анимация</title>
    <link rel="stylesheet" href="CSS/style.css">
    <script src="http://d3js.org/d3.v7.min.js"> </script>
    <script src="JavaScript/main.js"></script>
    <script src="JavaScript/image.js"></script>
    <script src="JavaScript/path.js"></script>
  </head>
  <body>   
    
    <form id="setting">
      <div class="form-row">
        <div id="coord-block" class="form-group">
        Координаты рисунка 
          <label for="cx">x: 
            <input type="number" id="cx" value="300" max="600" min="0">
            <span class="anim-field"> до 
              <input type="number" id="cx_end" value="500" >
            </span>
          </label>
          <label for="cy">y: 
            <input type="number" id="cy" value="300" max="600" min="0">
            <span class="anim-field"> до 
              <input type="number" id="cy_end" value="500">
            </span>
          </label>
        </div>

        <div id="path-block" class="form-group path-field">
            <strong>Пути перемещения</strong>
            <select id="pathSelect">
                <option value="gamma">Буквой «Г»</option>
                <option value="circle">По кругу</option>
            </select>
        </div>

        <div id="scale-block" class="form-group">
          Масштаб 
          <label for="sx">по x: <input type="number" id="xx" value="1">
            <span class="anim-field"> до 
              <input type="number" id="xx_end" value="2" step="0.1">
            </span>
          </label>
          <label for="sy">по y: <input type="number" id="yy" value="1">
            <span class="anim-field"> до 
              <input type="number" id="yy_end" value="2" step="0.1">
            </span>
          </label>
        </div>

        <div id="rotate-block" class="form-group">
          Поворот 
          <label for="rot">угол: <input type="number" id="rot" value="0">
            <span class="anim-field"> до 
              <input type="number" id="rot_end" value="180">
            </span>
          </label>
        </div>
      </div>
      <p>  
      <input type="button" id="draww" value="Нарисовать">
      <input type="button" id="dell" value="Очистить">
      </p>
      
            
      <label><input type="checkbox" id="checkAnim"> Включить анимацию?</label>
      
      <span class="anim-field">
        <select id="easingType">
            <option value="linear">linear</option>
            <option value="elastic">elastic</option>
            <option value="bounce">bounce</option>
        </select>
        <label><input type="checkbox" id="pathCheck"> Перемещение вдоль пути?</label><br>
        <input type="button" id="animBtn" value="Анимировать">
      </span>

    </form>

    <svg></svg>

  </body>
</html>
